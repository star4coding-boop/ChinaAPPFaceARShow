<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR 變裝濾鏡</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; font-family: "Microsoft JhengHei", sans-serif; }
    
    /* 啟動畫面 */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #fdfbf7; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 999;
      text-align: center;
    }
    button {
      padding: 15px 30px; font-size: 18px; background: #d84315; color: white;
      border: none; border-radius: 50px; cursor: pointer; margin-top: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    
    /* 拍照按鈕 */
    #capture-btn {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      width: 70px; height: 70px; background: white; border: 4px solid #d84315;
      border-radius: 50%; z-index: 1000; cursor: pointer; display: none;
    }
    #capture-btn:active { transform: translateX(-50%) scale(0.9); }

    /* 錯誤訊息 */
    #error-msg { color: red; margin-top: 10px; display: none; padding: 0 20px; }
  </style>
</head>
<body>

  <div id="start-screen">
    <h2 style="color:#5d4037">🎭 中華文化 AR 變裝</h2>
    <p style="color:#888">請允許相機權限以開始體驗</p>
    <div id="error-msg"></div>
    <button id="start-btn">👉 啟動相機</button>
  </div>

  <a-scene mindar-face="autoStart: false; filterMinCF:0.001; filterBeta: 0.01" 
           embedded color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="hat-img" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/face-tracking/assets/spark/spark.png">
    </a-assets>

    <a-camera active="false" position="0 0 0"></a-camera>

    <a-entity mindar-face-target="anchorIndex: 168">
      <a-image src="#hat-img" position="0 0.1 0" scale="0.6 0.6 0.6"></a-image>
    </a-entity>
  </a-scene>

  <div id="capture-btn"></div>

  <script>
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const captureBtn = document.getElementById('capture-btn');
    const scene = document.querySelector('a-scene');
    const errorMsg = document.getElementById('error-msg');

    startBtn.addEventListener('click', async () => {
      startBtn.innerText = "啟動中...";
      try {
        // 嘗試啟動 AR
        await scene.systems['mindar-face-system'].start();
      } catch (e) {
        console.error(e);
        // 如果失敗，通常是不支援或權限問題
        if (window.location.protocol !== 'https:') {
            errorMsg.innerText = "錯誤：必須使用 HTTPS 協定";
        } else {
            errorMsg.innerText = "無法開啟相機，請檢查瀏覽器權限。";
        }
        errorMsg.style.display = 'block';
        startBtn.innerText = "重試";
      }
    });

    scene.addEventListener("arReady", () => {
      startScreen.style.display = 'none';
      captureBtn.style.display = 'block';
    });

    captureBtn.addEventListener('click', () => {
      const video = document.querySelector('video');
      const aSceneCanvas = scene.components.screenshot.getCanvas('perspective');
      const canvas = document.createElement('canvas');
      if (video && aSceneCanvas) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.save(); ctx.scale(-1, 1);
        ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
        ctx.restore();
        ctx.drawImage(aSceneCanvas, 0, 0, canvas.width, canvas.height);
        
        const link = document.createElement('a');
        link.download = 'ar-photo.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
    });
  </script>
</body>
</html>
